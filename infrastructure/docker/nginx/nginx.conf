events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream definitions
    upstream auth_service {
        server auth-service:8000;
    }

    upstream market_data_service {
        server market-data-service:8000;
    }

    upstream scanner_service {
        server scanner-service:8000;
    }

    upstream backtest_service {
        server backtest-service:8000;
    }

    upstream paper_trading_service {
        server paper-trading-service:8000;
    }

    upstream brain_service {
        server brain-service:8000;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            return 200 '{"status": "healthy", "gateway": "nginx"}';
            add_header Content-Type application/json;
        }

        # AI Brain Service
        location /api/v1/brain/ {
            proxy_pass http://brain_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Authentication Service
        location /api/v1/auth/ {
            proxy_pass http://auth_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Market Data Service
        location /api/v1/market/ {
            proxy_pass http://market_data_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Scanner Service
        location /api/v1/scan/ {
            proxy_pass http://scanner_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backtesting Service
        location /api/v1/backtest/ {
            proxy_pass http://backtest_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Paper Trading Service
        location /api/v1/paper/ {
            proxy_pass http://paper_trading_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Default - return 404 for unmatched routes
        location / {
            return 404 '{"error": "Not Found", "message": "Route not matched by gateway"}';
            add_header Content-Type application/json;
        }
    }
}
