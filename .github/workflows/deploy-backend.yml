name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'infrastructure/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/trading-platform
            git pull origin main
            
            # Update .env file with secrets
            echo "ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}" > .env
            echo "ALPACA_API_SECRET=${{ secrets.ALPACA_API_SECRET }}" >> .env
            echo "MASSIVE_API_KEY=${{ secrets.MASSIVE_API_KEY }}" >> .env
            echo "Z_AI_API_KEY=${{ secrets.Z_AI_API_KEY }}" >> .env
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
            echo "VERCEL_API_KEY=${{ secrets.VERCEL_API_KEY }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            
            docker-compose pull
            docker-compose up -d --build
            docker system prune -f
