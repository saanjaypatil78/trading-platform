name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'infrastructure/**'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
             chmod +x /opt/trading-platform/infrastructure/scripts/deploy.sh
             /opt/trading-platform/infrastructure/scripts/deploy.sh main
