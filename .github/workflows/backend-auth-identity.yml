name: Backend Auth and Collaboration Domain Tests

on:
  push:
    branches:
      - "**"
    paths:
      - "backend/services/auth/**"
      - "backend/shared/config.py"
      - "backend/tests/test_auth_identity.py"
      - "backend/services/collaboration/**"
      - "backend/tests/test_collaboration_workflow.py"
      - ".github/workflows/backend-auth-identity.yml"
  pull_request:
    paths:
      - "backend/services/auth/**"
      - "backend/shared/config.py"
      - "backend/tests/test_auth_identity.py"
      - "backend/services/collaboration/**"
      - "backend/tests/test_collaboration_workflow.py"
      - ".github/workflows/backend-auth-identity.yml"

permissions:
  contents: read

jobs:
  auth-and-collaboration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.109.0 pydantic==2.5.3 pydantic-settings==2.1.0 httpx==0.26.0 pytest==7.4.4 pytest-asyncio==0.23.3

      - name: Run auth and collaboration domain tests
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-only-secret
          SUPABASE_URL: https://auth.example.test
          SUPABASE_ANON_KEY: test-anon-key
        run: python -m pytest -q backend/tests/test_auth_identity.py backend/tests/test_collaboration_workflow.py
