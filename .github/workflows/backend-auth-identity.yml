name: Backend Auth and Collaboration Domain Tests

on:
  push:
    branches:
      - "**"
    paths:
      - "backend/services/auth/**"
      - "backend/shared/config.py"
      - "backend/shared/database.py"
      - "backend/services/scanner/models.py"
      - "backend/services/collaboration/**"
      - "backend/unified_entrypoint.py"
      - "backend/migrations/**"
      - "backend/alembic.ini"
      - "backend/tests/test_auth_identity.py"
      - "backend/tests/test_database_metadata.py"
      - "backend/tests/test_workspace_authorization.py"
      - "backend/tests/test_workspace_api.py"
      - "backend/tests/test_collaboration_workflow.py"
      - "backend/tests/test_migrations.py"
      - ".github/workflows/backend-auth-identity.yml"
  pull_request:
    paths:
      - "backend/services/auth/**"
      - "backend/shared/config.py"
      - "backend/shared/database.py"
      - "backend/services/scanner/models.py"
      - "backend/services/collaboration/**"
      - "backend/unified_entrypoint.py"
      - "backend/migrations/**"
      - "backend/alembic.ini"
      - "backend/tests/test_auth_identity.py"
      - "backend/tests/test_database_metadata.py"
      - "backend/tests/test_workspace_authorization.py"
      - "backend/tests/test_workspace_api.py"
      - "backend/tests/test_collaboration_workflow.py"
      - "backend/tests/test_migrations.py"
      - ".github/workflows/backend-auth-identity.yml"

permissions:
  contents: read

jobs:
  auth-and-collaboration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trading_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trading_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.109.0 pydantic==2.5.3 pydantic-settings==2.1.0 httpx==0.26.0 sqlalchemy==2.0.25 alembic==1.13.1 psycopg2-binary==2.9.9 pytest==7.4.4 pytest-asyncio==0.23.3

      - name: Run auth, database, workspace API, authorization, migration, and collaboration tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trading_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-only-secret
          SUPABASE_URL: https://auth.example.test
          SUPABASE_ANON_KEY: test-anon-key
        run: python -m pytest -q backend/tests/test_auth_identity.py backend/tests/test_database_metadata.py backend/tests/test_workspace_authorization.py backend/tests/test_workspace_api.py backend/tests/test_migrations.py backend/tests/test_collaboration_workflow.py
